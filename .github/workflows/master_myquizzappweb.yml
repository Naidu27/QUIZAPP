name: Build and deploy Node.js app to Azure Web App - Myquizzappweb

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        working-directory: ./server
        run: npm install

      - name: Build and test
        working-directory: ./server
        run: |
          npm run build --if-present
          npm run test --if-present

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A81E2BFABAF44D02B1E0D6666FFE15D6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E3CCAD252A0542D896D00A24A078E8C3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2849696C3AC049428AB068354F1B4029 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Myquizzappweb'
          slot-name: 'Production'
          package: .
